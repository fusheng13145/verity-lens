# Bundle 清单 — compsci（计算机科学）L2
# 仅声明 Skill 路径 / Preset Patch / MCP 配置。
# 加载逻辑由编排层实现（orchestrator/bundle_loader.py → HAL 注册接口），不直接调用底座内核。
name: "compsci"
level: "L2"
discipline: "compsci"
description: "计算机科学方法论约束：可复现计算实验（固定种子 / n≥3 / 环境 / 哈希 / 不确定度 / 基线差异）+ 文献证据分级"

skills:
  - skills/compsci-computation/SKILL.md
  - skills/compsci-literature/SKILL.md

# L2：Preset 补丁（学科方法论注入系统提示；由 SKILL.md 蒸馏，蓝图表 §2.1 降级表）
preset_patch:
  preset: "verity-research"
  system_prompt: |
    可复现计算实验规范（compsci-computation）：
    1. 随机种子必须固定且记录（random_seed 为非负整数且实际生效）；
    2. 每个实验 n_runs≥3，报告均值±标准差，禁止仅报单次最优；
    3. 运行环境必须记录（框架版本 / 依赖 / 硬件 / 确定性设置）；
    4. 数据与代码可溯源（data_hash 或 code_hash 非空）；
    5. 主指标必须带 std 或 CI，禁止只报点估计；
    6. 基线对比须报告 baseline_delta 与显著性，禁止仅声称 SOTA。
    关键数值必须经 sidecar 确定性工具复算，不得自行产出。
  tool_whitelist: ["stat_test", "doi_verify", "power_analysis", "desensitize"]

# L2：MCP 服务声明（sidecar 确定性工具，stdio 协议；入口见 sidecar/tools/_stdio.py）
mcp:
  servers:
    - name: "verity-stat-test"
      transport: "stdio"
      command: ["python", "-m", "sidecar.tools.stat_test"]
      tools: ["stat_test"]
      description: "统计检验（p 值 / 效应量 / 95% CI），确定性复算"
    - name: "verity-doi-verify"
      transport: "stdio"
      command: ["python", "-m", "sidecar.tools.doi_verify"]
      tools: ["doi_verify"]
      description: "DOI 归一化 + Crossref 存在性校验，网络降级"
    - name: "verity-power-analysis"
      transport: "stdio"
      command: ["python", "-m", "sidecar.tools.power_analysis"]
      tools: ["power_analysis"]
      description: "功效分析（先验样本量 / 事后功效），METH 归因硬证据"
    - name: "verity-desensitize"
      transport: "stdio"
      command: ["python", "-m", "sidecar.tools.desensitize"]
      tools: ["desensitize"]
      description: "敏感数据脱敏（字段屏蔽/k-匿名/DP聚合）+ PHI 文本扫描守卫，E10 防护"

# L2：Golden 用例（L1 验证脚本的输入/期望输出对，tests/golden/test_bundle_golden.py 回归）
golden_cases:
  - golden/repro_ok.input.json
  - golden/point_estimate_only.input.json
  - golden/sota_no_baseline.input.json
