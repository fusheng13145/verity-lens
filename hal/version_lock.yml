# HAL 版本锁（Capability Lock）
# 记录"针对该底座版本验证过的能力"，底座升级须修改本文件并过 `make hal-contract-test`。
#
# 证据来源（deepseek-ai/deepseek-harness，MIT，developer preview）：
#   docs/cli-help.md          launcher / profile / --patch / headless --json / --session-id
#   docs/capability-seams.md  ctx.skills / ctx.subagents / ctx.mcpResources / ctx.sessionPersistence
#   docs/config-catalog.md    mcp-client StdioConfig（serverName / command / args …）
# 本机实测（2026-10-16，npm 安装 @deepseek-ai/dsh@0.2.0-rc.2）：
#   dsh --version                  → 0.2.0-rc.2
#   dsh --help                     → 有 --profile / --patch / --dump-config / --dump-config-schema / --from-default-profile
#   dsh --profile headless --help  → 有 --json / --session-id（NDJSON 事件流 + Session 接管）
#   dsh --profile headless --dump-config-schema → 输出 Cordis 配置 JSON Schema（draft 2020-12）
# 端到端联调（2026-10-16，真实底座）：
#   --json 真实事件流已被 parse_event_stream 解析；--session-id 已知 id 接管成功、未知 id
#   报 "does not exist"；完整运行因 deepseek API QUOTA（余额不足，外部账户）在模型调用处
#   失败，非底座 / 契约问题。
source: "https://github.com/deepseek-ai/deepseek-harness"
verified_version: "0.2.0-rc.2"        # 本机实测通过的版本（npm @deepseek-ai/dsh@0.2.0-rc.2）
contract_baseline: "0.2.1-alpha.3"    # 官方 master 契约基线（CLI 文档来源，与 0.2.0-rc.2 门控特性一致）
verified_at: "2026-10-16"
capabilities:
  # launcher CLI 未暴露轨迹分叉命令；会话内"已完成前缀分叉"走 ctx.subagents 的
  # forkProvider / subagent-fork-in-process，属会话内委派，HAL 不穿透 → 恒定降级为 replay
  trajectory_fork: false
  preset_patch: true        # --patch <path>（0.1.5-rc.2 起即有；0.2.0-rc.2 复验）
  subagent: true            # ctx.subagents + tool-subagent + agent-team（会话内委派）
  mcp: true                 # @deepseek-ai/dsh-mcp-client StdioConfig
  session_log_export: true  # headless --json（NDJSON）；0.2.0-rc.2 真实底座已验证可解析
  session_adopt: true       # headless --session-id（≥0.2）；0.2.0-rc.2 真实底座已验证接管 / 未知 id 报错
known_differences:
  - "DSH 处于 developer preview，官方明示会有破坏性变更；每次升级须重跑 hal-contract-test"
  - "0.2.0-rc.2 已具备 --json / --session-id / --dump-config-schema：事件流与 session 接管不再降级，patch 字段 schema 可用 --dump-config-schema 机读校验"
  - "完整 headless 运行依赖 deepseek API 配额；本机账户 QUOTA（余额不足）导致模型调用失败，属外部账户问题，与 verity-lens 契约无关"
  - "capabilities = 版本锁结论 ∩ 运行期版本特性探测（运行期只收窄不放宽）"
  - "季度切换演练（2026-10-16 首跑）发现并已解决：本机旧全局 dsh（D:/Node.js，0.1.5-rc.2）曾在 PATH 中遮蔽用户级新装（0.2.0-rc.2），shutil.which 解析到旧版会使 --json/--session-id 静默降级。处置：hal/dsh_adapter 支持 DSH_BIN 环境变量（多版本共存出口）；npm 全局 prefix 对齐用户级 .npm-global 并加入用户 PATH；旧全局安装已删除。现 dsh --version = 0.2.0-rc.2（= verified_version），演练 5/5 全 PASS（2026-10-16 复验）"
